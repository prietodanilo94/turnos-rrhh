version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-turnos_rrhh}
      POSTGRES_USER: ${DB_USER:-turnos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-turnos_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    # Removed port exposure to avoid conflict with existing shared-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-turnos_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-turnos_user}:${DB_PASSWORD:-turnos_secure_2026}@db:5432/${DB_NAME:-turnos_rrhh}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://tu-dominio.cl,http://localhost:3010}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@automotora.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_RUT: ${ADMIN_RUT:-11.111.111-1}
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "3010:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-https://turnos.dpmake.cl}
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
