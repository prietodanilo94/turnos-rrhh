name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        cat >> ~/.ssh/config << EOF
        Host vps
          HostName ${{ secrets.VPS_HOST }}
          User ${{ secrets.VPS_USER }}
          IdentityFile ~/.ssh/deploy_key
          StrictHostKeyChecking no
        EOF

    - name: Deploy files to VPS
      run: |
        echo "=== Sincronizando archivos ==="
        # Excluir .git, .github y archivos sensibles
        rsync -avz --delete \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='.env' \
          --exclude='.env.example' \
          --exclude='postgres_data' \
          --exclude='node_modules' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/turnos-rrhh/

    - name: Rebuild containers on VPS
      run: |
        echo "=== Reconstruyendo contenedores ==="
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'REMOTE_SCRIPT'
          cd /opt/turnos-rrhh
          echo "Directorio actual: $(pwd)"
          ls -la

          # Verificar que .env existe
          if [ ! -f ".env" ]; then
            echo "ERROR: .env no encontrado"
            exit 1
          fi

          # Reconstruir contenedores
          docker-compose down
          docker-compose up -d --build

          # Verificar estado
          echo "=== Estado de contenedores ==="
          docker-compose ps

          echo "=== Deploy completado ==="
        REMOTE_SCRIPT
